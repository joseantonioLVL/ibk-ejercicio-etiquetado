const WEBHOOK_URL = 'https://lavictorialab.app.n8n.cloud/webhook/ibk-ejercicio-etiquetado';
const STORAGE_KEY = 'ibk_ejercicio_v2';  // v2: cambió el schema (quité tipo_conv, agregué atipico)

let state = loadState() || {
  session_id: crypto.randomUUID(),
  etiquetador: '',
  current: 0,
  respuestas: {},
  started_at: null,
  caso_start_at: null,
};

function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function loadState() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { return null; } }
function resetState() {
  localStorage.removeItem(STORAGE_KEY);
  state = { session_id: crypto.randomUUID(), etiquetador: '', current: 0, respuestas: {}, started_at: null, caso_start_at: null };
}

function showSaveIndicator() {
  const el = document.getElementById('saveIndicator');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1500);
}

async function enviarAlServidor(caso, r) {
  const tiempo = state.caso_start_at ? Math.round((Date.now() - state.caso_start_at) / 1000) : null;
  const payload = {
    session_id: state.session_id,
    etiquetador: state.etiquetador,
    caso_id: caso.caso_id,
    caso_index: caso.index,
    dim_principal: r.dim_principal || null,
    dim_secundaria: r.dim_secundaria === 'ninguna' ? null : (r.dim_secundaria || null),
    caso_critico: r.caso_critico === 'no' ? null : (r.caso_critico || null),
    caso_atipico: r.caso_atipico === 'no' ? null : (r.caso_atipico || null),
    tiempo_seg: tiempo,
  };
  try {
    const resp = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    if (resp.ok) showSaveIndicator();
  } catch (e) { console.warn('No se pudo enviar:', e); }
}

function render() {
  const app = document.getElementById('app');
  if (!state.etiquetador) renderBienvenida(app);
  else if (state.current < CASOS.length) renderCaso(app, CASOS[state.current]);
  else renderFin(app);
}

  });

  document.getElementById('btnPrev').addEventListener('click', () => {
    if (state.current > 0) {
      state.current--;
      state.caso_start_at = Date.now();
      saveState();
      render();
    }
  });
  document.getElementById('btnNext').addEventListener('click', async () => {
    if (!validarCompleto(r)) return;
    await enviarAlServidor(caso, r);
    state.current++;
    state.caso_start_at = Date.now();
    saveState();
    window.scrollTo({top: 0, behavior: 'smooth'});
    render();
  });
  actualizarBotonNext(r);
}

function actualizarBotonNext(r) {
  const btn = document.getElementById('btnNext');
  if (!btn) return;
  btn.disabled = !validarCompleto(r);
}

function validarCompleto(r) {
  return r.dim_principal && r.caso_critico && r.caso_atipico && (r.dim_secundaria || r.dim_secundaria === 'ninguna');
}

function dimensionButtons(selected) {
  const dims = [
    ['A', 'Tarifario'],
    ['B', 'Plataforma digital'],
    ['C', 'Operaciones'],
    ['D', 'Atención'],
    ['E', 'Productos'],
    ['F', 'Onboarding'],
    ['G', 'Percepción general'],
  ];
  return dims.map(([code, name]) =>
    `<button class="btn-option ${selected === code ? 'selected' : ''}" data-value="${code}"><span class="code">${code}</span> ${name}</button>`
  ).join('');
}

function renderFin(app) {
  const totalSeg = state.started_at ? Math.round((Date.now() - state.started_at) / 1000) : 0;
  const min = Math.floor(totalSeg / 60);
  const seg = totalSeg % 60;
  app.innerHTML = `
    <div class="fin">
      <div class="check">✓</div>
      <h1>¡Listo, ${escapeHTML(state.etiquetador)}!</h1>
      <p>Clasificaste ${CASOS.length} casos en ${min} min ${seg} s.</p>
      <p class="subtle">Los datos fueron enviados a La Victoria Lab.<br>Muchas gracias por tu tiempo.</p>
      <button class="btn-nav secondary" style="margin-top: 24px;" onclick="if(confirm('¿Reiniciar y empezar de nuevo?')) { resetState(); render(); }">Reiniciar ejercicio</button>
    </div>
  `;
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

window.addEventListener('beforeunload', (e) => {
  if (state.etiquetador && state.current < CASOS.length && state.current > 0) {
    e.preventDefault();
    e.returnValue = 'Tu progreso está guardado, pero perderás la sesión abierta. ¿Continuar?';
  }
});

render();
</script>
</body>
</html>
